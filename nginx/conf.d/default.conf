server {
    listen 25680;
    server_name "";

    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.18.0.0/16;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    root /home/container/www;
    index index.html index.htm index.php;
    charset utf-8;

    absolute_redirect off;
    port_in_redirect off;

    set $redirect_ext 0;
if ($request_method = GET) {
    set $redirect_ext "${redirect_ext}G";
}
if ($request_uri ~* "^(.+)\.(html|php)$") {
    set $redirect_ext "${redirect_ext}E";
}
if ($redirect_ext = "0GE") {
    return 301 $1;
}

    location / {
        try_files $uri $uri/ @extension;
    }

    # Extensionless URLs: route to the .html or .php file that actually exists.
    # The "last" flag forces nginx to re-run location matching, so the request
    # lands on the .html/.php location blocks below (which pass to PHP-FPM)
    # instead of being served as a static file.
    location @extension {
        if (-f $document_root$uri.html) {
            rewrite ^(.*)$ $1.html last;
        }
        if (-f $document_root$uri.php) {
            rewrite ^(.*)$ $1.php last;
        }
        return 404;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    client_max_body_size 100m;
    client_body_timeout 120s;
    sendfile off;

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        try_files $fastcgi_script_name =404;
        fastcgi_pass unix:/home/container/tmp/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size=100M";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors on;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ \.html$ {
        fastcgi_split_path_info ^(.+\.html)(/.+)$;
        try_files $fastcgi_script_name =404;
        fastcgi_pass unix:/home/container/tmp/php-fpm.sock;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size=100M";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors on;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ /\.git {
        deny all;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~ /\.env {
        deny all;
    }

    location ~ /\.svn {
        deny all;
    }

    location ~ /composer\.(json|lock)$ {
        deny all;
    }

    location ~ /package(-lock)?\.json$ {
        deny all;
    }

    location ~ /\.user\.ini$ {
        deny all;
    }

    location ~ /\.(bak|config|sql|fla|psd|ini|log|sh|inc|swp|dist)$ {
        deny all;
    }
}
