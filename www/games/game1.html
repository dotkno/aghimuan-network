<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AghiClaw 3D — Aghimuan Games</title>
<style>
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  html, body {
    width: 100vw;
    height: 100vh;
    background-color: #0b0d14;
    overflow: hidden;
    font-family: system-ui, -apple-system, sans-serif;
  }

  /* Main container spanning full screen with equal margin */
  .game-wrapper {
    position: fixed;
    top: 16px;
    bottom: 16px;
    left: 16px;
    right: 16px;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    gap: 16px;
  }

  /* Back button container completely outside the game viewport */
  .back-nav {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 12px;
    color: #ffffff;
    text-decoration: none;
    transition: background 0.2s ease, transform 0.2s ease, border-color 0.2s ease;
  }

  .back-btn:hover {
    background: rgba(255, 255, 255, 0.15);
    border-color: rgba(255, 255, 255, 0.3);
    transform: scale(1.05);
  }

  .back-btn svg {
    width: 24px;
    height: 24px;
    fill: currentColor;
  }

  /* Frame holder that centers and enforces orientation rules */
  .viewport-container {
    flex: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 0;
    min-height: 0;
  }

  /* 
     Default setup: Landscape aspect ratio (16:9) scaled dynamically to fit 
     within available bounds without distorting or overflowing.
  */
  .game-frame {
    width: 100%;
    height: 100%;
    max-width: calc((100vh - 32px) * (16 / 9));
    max-height: calc((100vw - 96px) * (9 / 16));
    aspect-ratio: 16 / 9;
    border: 1px solid rgba(255, 255, 255, 0.1);
    border-radius: 12px;
    background: #000;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  }

  /* 
     Mobile portrait layout rules (< 768px wide or explicit portrait screen)
  */
  @media (max-width: 768px), (orientation: portrait) {
    .game-wrapper {
      top: 12px;
      bottom: 12px;
      left: 12px;
      right: 12px;
      flex-direction: column;
      gap: 12px;
    }

    .back-nav {
      width: 100%;
      justify-content: flex-start;
    }

    .game-frame {
      aspect-ratio: 9 / 16;
      max-width: calc((100vh - 92px) * (9 / 16));
      max-height: calc((100vw - 24px) * (16 / 9));
    }
  }
</style>
</head>
<body>

<div class="game-wrapper">
  
  <nav class="back-nav">
    <a href="index.html" class="back-btn" aria-label="Return to library" title="Return to library">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
    </a>
  </nav>

  <div class="viewport-container">
    <iframe
      src="aghiclaw.html"
      title="AghiClaw 3D game"
      class="game-frame"
      allow="fullscreen"
      loading="eager">
    </iframe>
  </div>

</div>

</body>
</html>
