<script>
  const PFP_PRESETS = (window.AGHI_CONFIG && window.AGHI_CONFIG.presets) || [
    { id: 'default',      color: '#5F5E5A' },
    { id: 'circuit-blue', color: '#185FA5' },
    { id: 'circuit-cyan', color: '#0F6E56' },
    { id: 'node-teal',    color: '#04342C' },
    { id: 'spark-orange', color: '#993C1D' },
    { id: 'wire-purple',  color: '#534AB7' },
    { id: 'chip-green',   color: '#3B6D11' },
    { id: 'signal-pink',  color: '#993556' },
  ];

  function presetColor(pfpId) {
    const match = PFP_PRESETS.find((p) => p.id === pfpId);
    return (match || PFP_PRESETS[0]).color;
  }

  function resolveAvatar(pfpId) {
    const id = (pfpId !== null && pfpId !== undefined && pfpId !== '') ? pfpId : 'default';
    const isPreset = PFP_PRESETS.includes(id);
    return {
      isPreset,
      color: isPreset ? presetColor(id) : null,
      url: isPreset ? null : ('/uploads/pfp/' + id),
    };
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str == null ? '' : String(str);
    return div.innerHTML;
  }

  const urlParams = new URLSearchParams(window.location.search);
  const creationId = urlParams.get('id');

  async function loadCreation() {
    const container = document.getElementById('creationContent');
    
    if (!creationId) {
      container.innerHTML = '<p class="empty-state">No creation specified.</p>';
      return;
    }

    try {
      const response = await fetch(`api/creations.php?id=${creationId}`);
      const data = await response.json();

      if (!data.ok || !data.creation) {
        container.innerHTML = '<p class="empty-state">Creation not found.</p>';
        return;
      }

      const c = data.creation;
      const avatar = resolveAvatar(c.pfp_id);
      const avatarHtml = c.pfp_id && !avatar.isPreset
        ? `<img src="${avatar.url}" alt="${escapeHtml(c.username)}" data-avatar-name="${escapeHtml(c.username)}" data-avatar-color="${avatar.color}">`
        : `<div class="fb-avatar fb-avatar-mono" style="background-color:${avatar.color};width:24px;height:24px;">${escapeHtml(c.username.charAt(0).toUpperCase())}</div>`;

      const mediaUrls = c.media_urls ? JSON.parse(c.media_urls) : [];
      const toolsUsed = c.tools_used ? JSON.parse(c.tools_used) : [];

      const galleryHtml = mediaUrls.length > 0 
        ? `<div class="creation-gallery">${mediaUrls.map(url => `<img src="${url}" alt="${escapeHtml(c.title)}" data-fallback="hide" onclick="openLightbox('${url}')">`).join('')}</div>`
        : '';

      const toolsHtml = toolsUsed.length > 0
        ? `<div class="tools-list">${toolsUsed.map(tool => `<span class="tool-tag">${escapeHtml(tool)}</span>`).join('')}</div>`
        : '<span class="detail-value">None specified</span>';

      const externalLinkHtml = c.external_link
        ? `<a href="${escapeHtml(c.external_link)}" target="_blank" rel="noopener noreferrer" class="external-link-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
            View Project
           </a>`
        : '';

      container.innerHTML = `
        <div class="creation-header">
          <h1 class="creation-title">${escapeHtml(c.title)}</h1>
          <div class="creation-meta">
            <span class="creation-category">${escapeHtml(c.category.replace('_', ' '))}</span>
            <a href="profile.html?username=${escapeHtml(c.username)}" class="creator-link">
              ${avatarHtml}
              ${escapeHtml(c.username)}
            </a>
            <span>&bull;</span>
            <span>${new Date(c.created_at).toLocaleDateString()}</span>
          </div>
        </div>

        ${galleryHtml}

        <div class="creation-description">
          <h3>About This Project</h3>
          <p>${escapeHtml(c.description).replace(/\n/g, '<br>')}</p>
        </div>

        <div class="creation-details">
          <div class="detail-item">
            <div class="detail-label">Tools Used</div>
            <div class="detail-value">${toolsHtml}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Project Link</div>
            <div class="detail-value">${externalLinkHtml || 'No external link provided'}</div>
          </div>
          <div class="detail-item">
            <div class="detail-label">Submitted</div>
            <div class="detail-value">${new Date(c.created_at).toLocaleDateString()}</div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h2>Comments</h2>
          </div>
          <div class="fb-comments" data-post-id="creation-${c.id}"></div>
        </div>
      `;

      // Initialize reactions and comments
      if (window.initPostReactions) {
        window.initPostReactions(`creation-${c.id}`, 'creation');
      }
      if (window.AghiComments) {
        window.AghiComments.init();
      }
    } catch (err) {
      container.innerHTML = '<p class="empty-state">Failed to load creation.</p>';
    }
  }

  function openLightbox(url) {
    const lightbox = document.getElementById('lightbox');
    const img = document.getElementById('lightboxImg');
    img.src = url;
    lightbox.classList.add('open');
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
  }

  function setupSidebar() {
    const appSidebar = document.getElementById('appSidebar');
    const sidebarBackdrop = document.getElementById('sidebarBackdrop');
    const menuToggle = document.getElementById('menuToggle');
    const sidebarClose = document.getElementById('sidebarClose');

    function openDrawer() {
      appSidebar.classList.add('open');
      sidebarBackdrop.classList.add('open');
      menuToggle.setAttribute('aria-expanded', 'true');
    }
    function closeDrawer() {
      appSidebar.classList.remove('open');
      sidebarBackdrop.classList.remove('open');
      menuToggle.setAttribute('aria-expanded', 'false');
    }
    menuToggle.addEventListener('click', () => {
      appSidebar.classList.contains('open') ? closeDrawer() : openDrawer();
    });
    sidebarClose.addEventListener('click', closeDrawer);
    sidebarBackdrop.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeDrawer();
    });
  }

  function setupClock() {
    const clockEl = document.getElementById('topbarClock');
    function updateClock() {
      const now = new Date();
      const dateStr = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
      clockEl.textContent = `${dateStr} · ${timeStr}`;
    }
    updateClock();
    setInterval(updateClock, 30000);
  }

  function setupBootText() {
    const el = document.getElementById('bootText');
    el.textContent = "aghimuan.net // status: online";
  }

  document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
  document.getElementById('lightbox').addEventListener('click', (e) => {
    if (e.target.id === 'lightbox') closeLightbox();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeLightbox();
  });

  loadCreation();
  setupSidebar();
  setupClock();
  setupBootText();
</script>
