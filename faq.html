<script>
  // ---------- sidebar drawer (mobile) ----------
  const appSidebar = document.getElementById('appSidebar');
  const sidebarBackdrop = document.getElementById('sidebarBackdrop');
  const menuToggle = document.getElementById('menuToggle');
  const sidebarClose = document.getElementById('sidebarClose');

  function openDrawer() {
    appSidebar.classList.add('open');
    sidebarBackdrop.classList.add('open');
    menuToggle.setAttribute('aria-expanded', 'true');
  }
  function closeDrawer() {
    appSidebar.classList.remove('open');
    sidebarBackdrop.classList.remove('open');
    menuToggle.setAttribute('aria-expanded', 'false');
  }
  menuToggle.addEventListener('click', () => {
    appSidebar.classList.contains('open') ? closeDrawer() : openDrawer();
  });
  sidebarClose.addEventListener('click', closeDrawer);
  sidebarBackdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeDrawer();
  });

  // ---------- topbar status line ----------
  const lines = [
    "aghimuan.net // status: online",
  ];
  const el = document.getElementById('bootText');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  if (reduceMotion) {
    el.textContent = lines[0];
  } else {
    let charIndex = 0;
    const current = lines[0];
    function typeStep() {
      if (charIndex <= current.length) {
        el.textContent = current.slice(0, charIndex);
        charIndex++;
        setTimeout(typeStep, 28);
      }
    }
    typeStep();
  }

  // ---------- topbar live clock ----------
  const clockEl = document.getElementById('topbarClock');
  function updateClock() {
    const now = new Date();
    const dateStr = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    const timeStr = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    clockEl.textContent = `${dateStr} · ${timeStr}`;
  }
  updateClock();
  setInterval(updateClock, 30000);

  // ---- FAQ data: edit this array directly to update the page. ----
  const FAQ_DATA = [
    {
      q: "Who can join Aghimuan?",
      a: "Membership is open to all PCU-D students, not limited to Senior High School — the club welcomes anyone across year levels who wants to learn and build in ICT."
    },
    {
      q: "Do I need prior programming or robotics experience to join?",
      a: "No. Aghimuan runs workshops and hands-on sessions built for beginners as well as members with existing experience, so you can start wherever you are."
    },
    {
      q: "What kinds of activities does the club run?",
      a: "Workshops, hands-on project builds, robotics sessions, and collaborative work across programming and system servicing — with members often mixing all three on a single project."
    },
    {
      q: "What resources are available to members?",
      a: "A growing library of ICT reviewers covering programming, system servicing, robotics, and networking, plus peer support from members already working in those areas."
    },
    {
      q: "How is the club organized?",
      a: "Aghimuan operates as the official ICT student organization of PCU-D, with activities and resources centered on its core focus areas: robotics, programming, and computer system servicing."
    },
    {
      q: "Can I contribute my own projects or resources to the club?",
      a: "Yes — Aghimuan is built as an open-source-minded community. Bring project ideas or resource suggestions to an officer, and they can be added to the club's materials directly."
    }
  ];

  const list = document.getElementById('faqList');
  FAQ_DATA.forEach((item, i) => {
    const wrapDiv = document.createElement('div');
    wrapDiv.className = 'faq-item';
    wrapDiv.dataset.open = 'false';
    wrapDiv.innerHTML = `
      <button class="faq-q" aria-expanded="false" aria-controls="faq-a-${i}" id="faq-q-${i}">
        <span>${item.q}</span>
        <span class="plus" aria-hidden="true">+</span>
      </button>
      <div class="faq-a" id="faq-a-${i}" role="region" aria-labelledby="faq-q-${i}">${item.a}</div>
    `;
    list.appendChild(wrapDiv);
  });

  list.addEventListener('click', (e) => {
    const btn = e.target.closest('.faq-q');
    if (!btn) return;
    const item = btn.closest('.faq-item');
    const answer = item.querySelector('.faq-a');
    const isOpen = item.dataset.open === 'true';

    item.dataset.open = String(!isOpen);
    btn.setAttribute('aria-expanded', String(!isOpen));
    answer.style.maxHeight = !isOpen ? answer.scrollHeight + 'px' : '0px';
  });
</script>
